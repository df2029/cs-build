name: linux-build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libssl-dev libplist-dev clang llvm lld unzip zip

      - name: Build ldid
        run: |
          git clone --depth 1 https://github.com/ProcursusTeam/ldid /tmp/ldid
          make -C /tmp/ldid -j2
          sudo cp /tmp/ldid/ldid /usr/local/bin/ldid
          ldid -V || true

      - name: Fetch iPhoneOS SDK
        run: |
          wget -q "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" -O /tmp/sdk.tar.xz
          sudo mkdir -p /opt/sdks
          sudo tar -xf /tmp/sdk.tar.xz -C /opt/sdks
          ls /opt/sdks

      - name: Expand app template (compiled storyboards)
        run: |
          mkdir -p /tmp/oldipa
          unzip -q template_bundle.zip -d /tmp/oldipa
          find /tmp/oldipa -name "*.storyboardc" -o -name "Info.plist" | head -10

      - name: Cross-compile arm64 Mach-O (UI shell + exploit)
        run: |
          SDK=/opt/sdks/iPhoneOS16.5.sdk
          mkdir -p /tmp/obj
          for f in main.m AppDelegate.m SceneDelegate.m ViewController.m poc.c phys_oob.c free_thread.c socket.c utils.c krw.c surface.c kmem.c; do
            clang -target arm64-apple-ios15.0 \
              -isysroot "$SDK" \
              -fobjc-arc -fobjc-runtime=ios-15.0.0 \
              -I./clearsword \
              -c "clearsword/$f" -o "/tmp/obj/${f%.*}.o"
          done
          ls -la /tmp/obj
          # Ubuntu's lld package installs ld.lld/lld-link but ld64.lld lives under
          # /usr/lib/llvm-*/bin/, and some images ship only lld-18's copy.
          LD64="$(command -v ld64.lld || true)"
          if [ -z "$LD64" ]; then
            LD64="$(ls /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$LD64" ]; then
            echo "ld64.lld not found, trying apt install lld-18"
            sudo apt-get install -y -q lld-18 || true
            LD64="$(ls /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null | head -1 || true)"
          fi
          echo "using linker: ${LD64:-MISSING}"
          "$LD64" \
            -arch arm64 -platform_version ios 15.0.0 16.5 \
            -syslibroot "$SDK" \
            -pie \
            -o /tmp/newbin \
            /tmp/obj/*.o \
            -framework IOKit -framework IOSurface -framework Foundation -framework UIKit \
            -lSystem -lobjc
          file /tmp/newbin || llvm-readobj -h /tmp/newbin | head -20

      - name: Assemble IPA
        run: |
          if [ -d /tmp/oldipa/Payload/clearsword.app ]; then
            echo "== using compiled storyboards from template_bundle.zip =="
            cp /tmp/newbin /tmp/oldipa/Payload/clearsword.app/clearsword
          else
            echo "!! template bundle missing; assembling minimal bundle from source"
            mkdir -p /tmp/oldipa/Payload/clearsword.app/Base.lproj
            cp /tmp/newbin /tmp/oldipa/Payload/clearsword.app/clearsword
            cp clearsword/Info.plist /tmp/oldipa/Payload/clearsword.app/
            cp clearsword/Base.lproj/Main.storyboard /tmp/oldipa/Payload/clearsword.app/Base.lproj/
            cp clearsword/Base.lproj/LaunchScreen.storyboard /tmp/oldipa/Payload/clearsword.app/Base.lproj/
            printf 'APPL????' > /tmp/oldipa/Payload/clearsword.app/PkgInfo
          fi
          chmod +x /tmp/oldipa/Payload/clearsword.app/clearsword
          ldid -Hsha1 -Sent.xml /tmp/oldipa/Payload/clearsword.app/clearsword
          ldid -e /tmp/oldipa/Payload/clearsword.app/clearsword | head -30
          cd /tmp/oldipa
          rm -f /tmp/clearsword-linux.ipa
          zip -qr9 /tmp/clearsword-linux.ipa Payload
          ls -la /tmp/clearsword-linux.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clearsword-linux
          path: /tmp/clearsword-linux.ipa
          retention-days: 30
